<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10080A"/>
      <stop offset="100%" stop-color="#381828"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#D04828" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10080A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- Clock face -->
  <circle cx="400" cy="265" r="190" fill="#180A0C" opacity="0.9"/>
  <circle cx="400" cy="265" r="178" fill="#221012"/>
  <circle cx="400" cy="265" r="168" fill="#2A1418" opacity="0.95"/>
  <!-- Clock ring -->
  <circle cx="400" cy="265" r="168" fill="none" stroke="#D4882A" stroke-width="4" opacity="0.7"/>
  <circle cx="400" cy="265" r="162" fill="none" stroke="#D4882A" stroke-width="1.5" opacity="0.3"/>
  <!-- Clock hour markers -->
  <g stroke="#D4882A" stroke-width="3" opacity="0.6">
    <line x1="400" y1="102" x2="400" y2="118"/>
    <line x1="400" y1="412" x2="400" y2="428"/>
    <line x1="237" y1="265" x2="253" y2="265"/>
    <line x1="547" y1="265" x2="563" y2="265"/>
  </g>
  <g stroke="#D4882A" stroke-width="2" opacity="0.35">
    <line x1="480" y1="110" x2="472" y2="124"/>
    <line x1="546" y1="175" x2="532" y2="183"/>
    <line x1="546" y1="355" x2="532" y2="347"/>
    <line x1="480" y1="420" x2="472" y2="406"/>
    <line x1="320" y1="420" x2="328" y2="406"/>
    <line x1="254" y1="355" x2="268" y2="347"/>
    <line x1="254" y1="175" x2="268" y2="183"/>
    <line x1="320" y1="110" x2="328" y2="124"/>
  </g>
  <!-- Clock hands -->
  <line x1="400" y1="265" x2="400" y2="148" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
  <line x1="400" y1="265" x2="478" y2="210" stroke="#D4882A" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <!-- Center dot -->
  <circle cx="400" cy="265" r="10" fill="#D4882A"/>
  <circle cx="400" cy="265" r="5" fill="#FFFFFF"/>
  <!-- Steam trails (speed lines) -->
  <g stroke="#E05820" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M235 195 Q210 195 195 195"/>
    <path d="M228 235 Q203 240 188 242"/>
    <path d="M238 168 Q215 162 200 158"/>
  </g>
  <!-- "20 MIN" badge -->
  <rect x="314" y="348" width="172" height="44" rx="22" fill="#D4882A" opacity="0.92"/>
  <text x="400" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white" letter-spacing="1.5">UNDER 30 MIN</text>
  <!-- Text -->
  <rect x="0" y="440" width="800" height="160" fill="#10080A" opacity="0.88"/>
  <text x="400" y="502" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="bold" fill="white">Quick &amp; Easy</text>
  <text x="400" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#D4882A" letter-spacing="1">15 RECIPES</text>
</svg>
